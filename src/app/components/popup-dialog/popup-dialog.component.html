<h2 matDialogTitle>{{ data.title }}</h2>
<mat-dialog-content>
  <p>"{{ data.message }}"</p>
  <p><i>{{ data.message2 }}</i></p>
  <mat-checkbox [checked]="rememberMqttAPIKey" (change)="onRememberMqttAPIKeyChange($event.checked)">
    Remember MQTT API key on this device
  </mat-checkbox>
  <!-- <p>When unchecked, the key is kept only for this session and cleared on logout.</p> -->
</mat-dialog-content>
<mat-dialog-actions align="end">
  <!--
    Note that you can pass in anything to the `matDialogClose` attribute. This also includes objects, arrays, etc.
    Just make sure that you make it a property binding with those [] brackets
    Example: <button mat-button [matDialogClose]="{'lol': true}">Cancel</button>
  -->

  <button mat-button [cdkCopyToClipboard]="data.message" matTooltip="Copy to clipboard">
    <mat-icon>content_copy</mat-icon>
  </button>

  <button mat-button matDialogClose="confirm" (click)="saveAndUse()" color="warn">
    Use in this app
  </button>
  <button mat-button matDialogClose="confirm" color="warn">OK</button>
</mat-dialog-actions>
